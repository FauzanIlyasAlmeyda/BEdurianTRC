services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
      APP_URL: ${APP_URL:?Set APP_URL in .env.docker}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env.docker}
      DB_PORT: ${DB_PORT:-17800}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.docker}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.docker}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ATTR_SSL_CA: /run/secrets/aiven-ca.pem
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - laravel_public_storage:/var/www/html/storage/app/public
      - ./docker/ca.pem:/run/secrets/aiven-ca.pem:ro
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  laravel_public_storage:
    name: duriantrace_laravel_public_storage
