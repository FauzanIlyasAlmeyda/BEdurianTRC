name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy latest main on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

          key_file="$RUNNER_TEMP/vps_deploy_key"
          known_hosts_file="$RUNNER_TEMP/vps_known_hosts"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          deploy_path_b64="$(printf '%s' "$VPS_DEPLOY_PATH" | base64 -w 0)"

          ssh \
            -p "$VPS_PORT" \
            -i "$key_file" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH_B64=$deploy_path_b64 bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 --decode)"
          cd "$DEPLOY_PATH"

          git pull --ff-only origin main

          compose() {
            docker compose -f compose.yaml --env-file .env.docker "$@"
          }

          compose build app
          compose run --rm app php artisan migrate --force
          compose up -d --no-deps app

          for attempt in $(seq 1 30); do
            if compose exec -T app curl --fail --silent http://127.0.0.1:8080/up >/dev/null; then
              echo "Laravel deployment is healthy."
              exit 0
            fi
            sleep 2
          done

          compose logs --tail=100 app
          echo "Laravel health check failed after deployment." >&2
          exit 1
          REMOTE
